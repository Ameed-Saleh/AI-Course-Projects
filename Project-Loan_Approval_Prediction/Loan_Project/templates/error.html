<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loan Approval Checker</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; text-align: center; max-width: 450px; border: 1px solid #334155; }
        h1 { color: #f87171; font-size: 22px; }
        p { color: #94a3b8; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Loan Approval Checker</h1>
        <p>The system is initializing, please wait...</p>
        <p style="color: #ef4444;">{{ message }}</p>
    </div>
</body>
</html>
