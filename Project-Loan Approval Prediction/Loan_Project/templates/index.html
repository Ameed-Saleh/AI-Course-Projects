<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Approval Checker | בדיקת זכאות להלוואה</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: all 0.25s ease; }
        body { background: radial-gradient(circle at top, #1e293b, #0f172a); color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .container { background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(10px); border-radius: 24px; padding: 36px; width: 100%; max-width: 520px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); position: relative; }
        
        /* Navigation & Language Header */
        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        
        .btn-dash { background: linear-gradient(135deg, #06b6d4, #3b82f6); color: #fff; text-decoration: none; padding: 8px 16px; border-radius: 12px; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 0 15px rgba(6, 182, 212, 0.3); }
        .btn-dash:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(6, 182, 212, 0.6); }

        .lang-switch { display: flex; gap: 4px; background: #0f172a; padding: 4px; border-radius: 12px; border: 1px solid #334155; }
        .lang-btn { background: none; border: none; color: #94a3b8; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 12px; }
        .lang-btn.active { background: #2563eb; color: #fff; box-shadow: 0 0 10px rgba(37, 99, 235, 0.5); }

        h1 { font-size: 26px; font-weight: 800; margin-bottom: 6px; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 24px; }
        
        .form-group { margin-bottom: 18px; text-align: start; }
        label { display: block; font-size: 13.5px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
        input, select { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 12px 14px; color: #f8fafc; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: #3b82f6; box-shadow: 0 0 12px rgba(59, 130, 246, 0.4); }
        
        input[readonly] { background: #182234 !important; cursor: not-allowed; border-color: #334155; color: #38bdf8; font-weight: 700; }

        .btn-submit { width: 100%; background: linear-gradient(135deg, #2563eb, #7c3aed); color: #ffffff; border: none; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4); }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(124, 58, 237, 0.6); }

        .result-card { margin-top: 24px; padding: 20px; border-radius: 16px; text-align: center; font-weight: 700; font-size: 20px; display: none; animation: popIn 0.3s ease-out; }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .approved { background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(6, 95, 70, 0.4)); border: 2px solid #10b981; color: #34d399; box-shadow: 0 0 20px rgba(16, 185, 129, 0.3); }
        .rejected { background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(153, 27, 27, 0.4)); border: 2px solid #ef4444; color: #f87171; box-shadow: 0 0 20px rgba(239, 68, 68, 0.3); }
        .result-desc { font-size: 13px; font-weight: 400; color: #cbd5e1; margin-top: 8px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-actions">
        <a href="/dashboard" class="btn-dash" id="btn-dash">
            <i class="fa-solid fa-chart-pie"></i> <span id="txt-dash-btn">מדדי המודל</span>
        </a>

        <div class="lang-switch">
            <button type="button" class="lang-btn active" onclick="setLanguage('he', event)">עברית 🇮🇱</button>
            <button type="button" class="lang-btn" onclick="setLanguage('en', event)">English 🇺🇸</button>
        </div>
    </div>

    <h1 id="txt-title">בדיקת זכאות להלוואה</h1>
    <p class="subtitle" id="txt-subtitle">הזן את פרטי המבקש לצורך ניתוח זכאות בזמן אמת</p>

    <form id="loanForm">
        <div class="form-group">
            <label id="lbl-age">🎂 גיל המבקש</label>
            <input type="number" id="person_age" value="24" required>
        </div>

        <div class="form-group">
            <label id="lbl-income">💵 הכנסה שנתית ($)</label>
            <input type="number" id="person_income" value="200000" required>
        </div>

        <div class="form-group">
            <label id="lbl-emp">💼 וותק בעבודה (בשנים)</label>
            <input type="number" id="person_emp_exp" value="3" required>
        </div>

        <div class="form-group">
            <label id="lbl-amount">💰 סכום ההלוואה המבוקש ($)</label>
            <input type="number" id="loan_amnt" value="40000" required>
        </div>

        <div class="form-group">
            <label id="lbl-rate">📈 שיעור ריבית (%)</label>
            <input type="number" step="0.01" id="loan_int_rate" value="14.0" required>
        </div>

        <div class="form-group">
            <label id="lbl-percent">⚡ אחוז הלוואה מההכנסה (מחושב אוטומטית)</label>
            <input type="number" step="0.01" id="loan_percent_income" value="0.20" readonly>
        </div>

        <div class="form-group">
            <label id="lbl-defaults">⚠️ חדלות פירעון בעבר?</label>
            <select id="previous_loan_defaults">
                <option value="N" id="opt-no">❌ לא (N)</option>
                <option value="Y" id="opt-yes">⚠️ כן (Y)</option>
            </select>
        </div>

        <button type="submit" class="btn-submit" id="btn-submit">🚀 בדוק זכאות עכשיו</button>
    </form>

    <div id="result" class="result-card"></div>
</div>

<script>
let currentLang = 'he';

const i18n = {
    he: {
        title: "בדיקת זכאות להלוואה",
        subtitle: "הזן את פרטי המבקש לצורך ניתוח זכאות בזמן אמת",
        dashBtn: "מדדי המודל",
        age: "🎂 גיל המבקש",
        income: "💵 הכנסה שנתית ($)",
        emp: "💼 וותק בעבודה (בשנים)",
        amount: "💰 סכום ההלוואה המבוקש ($)",
        rate: "📈 שיעור ריבית (%)",
        percent: "⚡ אחוז הלוואה מההכנסה (מחושב אוטומטית)",
        defaults: "⚠️ חדלות פירעון בעבר?",
        optNo: "❌ לא (N)",
        optYes: "⚠️ כן (Y)",
        btnSubmit: "🚀 בדוק זכאות עכשיו",
        approvedTitle: "🎉 יששש! ההלוואה אושרה! 💸💵",
        approvedDesc: "מזל טוב! המודל זיהה פרופיל אשראי מעולה ואישר את הבקשה.",
        rejectedTitle: "❌ מצטערים, הבקשה נדחתה 😔💸",
        rejectedDesc: "המודל זיהה רמת סיכון גבוהה מדי. מומלץ להקטין את סכום ההלוואה."
    },
    en: {
        title: "Loan Eligibility Checker",
        subtitle: "Enter applicant details to evaluate loan eligibility in real-time",
        dashBtn: "Model Metrics",
        age: "🎂 Applicant Age",
        income: "💵 Annual Income ($)",
        emp: "💼 Employment Experience (Years)",
        amount: "💰 Requested Loan Amount ($)",
        rate: "📈 Interest Rate (%)",
        percent: "⚡ Loan Percent of Income (Auto Calculated)",
        defaults: "⚠️ Previous Loan Defaults?",
        optNo: "❌ No (N)",
        optYes: "⚠️ Yes (Y)",
        btnSubmit: "🚀 Check Eligibility Now",
        approvedTitle: "🎉 Woohoo! Loan Approved! 💸💵",
        approvedDesc: "Congratulations! The model identified a strong credit profile.",
        rejectedTitle: "❌ Loan Not Approved 😔💸",
        rejectedDesc: "The model identified high risk. Try lowering the loan amount."
    }
};

function autoCalculatePercent() {
    const income = parseFloat(document.getElementById('person_income').value) || 0;
    const amount = parseFloat(document.getElementById('loan_amnt').value) || 0;
    
    if (income > 0) {
        document.getElementById('loan_percent_income').value = (amount / income).toFixed(2);
    } else {
        document.getElementById('loan_percent_income').value = 0;
    }
}

document.getElementById('person_income').addEventListener('input', autoCalculatePercent);
document.getElementById('loan_amnt').addEventListener('input', autoCalculatePercent);

function setLanguage(lang, evt) {
    currentLang = lang;
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';

    document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
    if(evt) evt.target.classList.add('active');

    const t = i18n[lang];
    document.getElementById('txt-title').innerText = t.title;
    document.getElementById('txt-subtitle').innerText = t.subtitle;
    document.getElementById('txt-dash-btn').innerText = t.dashBtn;
    document.getElementById('lbl-age').innerText = t.age;
    document.getElementById('lbl-income').innerText = t.income;
    document.getElementById('lbl-emp').innerText = t.emp;
    document.getElementById('lbl-amount').innerText = t.amount;
    document.getElementById('lbl-rate').innerText = t.rate;
    document.getElementById('lbl-percent').innerText = t.percent;
    document.getElementById('lbl-defaults').innerText = t.defaults;
    document.getElementById('opt-no').innerText = t.optNo;
    document.getElementById('opt-yes').innerText = t.optYes;
    document.getElementById('btn-submit').innerText = t.btnSubmit;

    document.getElementById('result').style.display = 'none';
}

document.getElementById('loanForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const resultDiv = document.getElementById('result');
    resultDiv.style.display = 'none';

    const payload = {
        person_age: document.getElementById('person_age').value,
        person_income: document.getElementById('person_income').value,
        person_emp_exp: document.getElementById('person_emp_exp').value,
        loan_amnt: document.getElementById('loan_amnt').value,
        loan_int_rate: document.getElementById('loan_int_rate').value,
        loan_percent_income: document.getElementById('loan_percent_income').value,
        previous_loan_defaults: document.getElementById('previous_loan_defaults').value
    };

    try {
        const response = await fetch('/api/model/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const data = await response.json();
        const t = i18n[currentLang];

        if (response.ok) {
            resultDiv.style.display = 'block';
            if (data.approved) {
                resultDiv.className = 'result-card approved';
                resultDiv.innerHTML = `<div>${t.approvedTitle}</div><div class="result-desc">${t.approvedDesc}</div>`;
            } else {
                resultDiv.className = 'result-card rejected';
                resultDiv.innerHTML = `<div>${t.rejectedTitle}</div><div class="result-desc">${t.rejectedDesc}</div>`;
            }
        } else {
            alert('Error: ' + data.error);
        }
    } catch (err) {
        alert('Failed to connect to server.');
    }
});

autoCalculatePercent();
</script>
</body>
</html>
