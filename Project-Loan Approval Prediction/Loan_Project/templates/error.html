<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Error | שגיאת מערכת</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: #f8fafc;
            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(37, 99, 235, 0.25),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 85% 90%,
                    rgba(124, 58, 237, 0.22),
                    transparent 34%
                ),
                #0f172a;
        }

        .error-card {
            width: 100%;
            max-width: 520px;
            padding: 38px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            background: rgba(30, 41, 59, 0.96);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.48);
            backdrop-filter: blur(14px);
            text-align: center;
        }

        .error-icon {
            width: 74px;
            height: 74px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            border: 2px solid #ef4444;
            border-radius: 50%;
            color: #f87171;
            background: rgba(239, 68, 68, 0.14);
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.22);
            font-size: 34px;
        }

        h1 {
            margin-bottom: 10px;
            color: #f87171;
            font-size: 27px;
            font-weight: 800;
        }

        .subtitle {
            margin-bottom: 22px;
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.7;
        }

        .message-box {
            margin-bottom: 24px;
            padding: 15px;
            border: 1px solid rgba(239, 68, 68, 0.45);
            border-radius: 12px;
            color: #fecaca;
            background: rgba(127, 29, 29, 0.2);
            font-size: 13px;
            line-height: 1.6;
            word-break: break-word;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .button {
            min-width: 150px;
            padding: 12px 18px;
            border: 0;
            border-radius: 12px;
            color: #fff;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            font-weight: 750;
            transition: 0.2s ease;
        }

        .primary-button {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            box-shadow: 0 5px 20px rgba(124, 58, 237, 0.3);
        }

        .secondary-button {
            border: 1px solid #475569;
            background: #334155;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .primary-button:hover {
            box-shadow: 0 7px 26px rgba(124, 58, 237, 0.48);
        }

        .secondary-button:hover {
            background: #475569;
        }

        .technical-note {
            margin-top: 24px;
            color: #64748b;
            font-size: 11px;
            line-height: 1.6;
        }

        @media (max-width: 520px) {
            body {
                padding: 14px;
            }

            .error-card {
                padding: 30px 20px;
            }

            .button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <main class="error-card">
        <div class="error-icon">!</div>

        <h1>המערכת אינה זמינה כרגע</h1>

        <p class="subtitle">
            לא ניתן להפעיל את מערכת חיזוי ההלוואה.
            ודאו שקובץ המודל קיים ושהמערכת הופעלה בצורה תקינה.
        </p>

        <div class="message-box">
            {{ message | default(
                "Model could not be loaded.",
                true
            ) }}
        </div>

        <div class="actions">
            <button
                type="button"
                class="button primary-button"
                onclick="window.location.reload()"
            >
                נסו שוב
            </button>

            <a
                href="/"
                class="button secondary-button"
            >
                חזרה לדף הראשי
            </a>
        </div>

        <p class="technical-note">
            ודאו שהקובץ loan_svc_model_v1.0.pkl נמצא באותה תיקייה
            שבה נמצא app.py.
        </p>
    </main>
</body>
</html>
